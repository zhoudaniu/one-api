name: Publish Docker image

on:
    push:
        branches: [main]
env:
    DOCKER_REGISTRY: 'docker-registry.yongjieshi818.workers.dev' # 镜像仓库地址 (ghcr.io/docker.io)
    DOCKER_REPOSITORY: 'one-api' # 镜像仓库
    IMAGE_NAME: ${{ github.event.repository.name }} # 镜像名称
    BRANCH_NAME: ${{ github.ref_name }}
jobs:
    push_to_registries:
        name: Push Docker image to multiple registries
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
        steps:
            - name: Check out the repo
              uses: actions/checkout@v3

            - name: Check repository URL
              run: |
                  REPO_URL=$(git config --get remote.origin.url)
                  if [[ $REPO_URL == *"pro" ]]; then
                    exit 1
                  fi

            - name: Save version info
              run: echo "${{ github.sha }}" > VERSION
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v2
              with:
                  registry: docker-registry.yongjieshi818.workers.dev
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64 # 可选: 添加 linux/arm64 支持多架构
                  push: true
                  tags: |
                      ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.BRANCH_NAME }}
                      ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=${{ github.repositoryUrl }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Print image URL
              run: |
                  echo "Successfully built and pushed image:"
                  echo "${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
